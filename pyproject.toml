[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer — web application for SEO page analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.1.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "page_analyzer/static/style.css",
]

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]
