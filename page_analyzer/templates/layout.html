<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Анализатор страниц{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="flex min-h-screen flex-col bg-gray-100">
    <nav class="bg-gray-800">
      <div class="container mx-auto flex items-center gap-6 px-4 py-3">
        <a class="text-white hover:text-gray-200" href="{{ url_for('index') }}">
          Анализатор страниц
        </a>
        <a class="text-gray-300 hover:text-white" href="{{ url_for('urls') }}">
          Сайты
        </a>
      </div>
    </nav>

    <main class="flex flex-grow flex-col">
      <div class="container mx-auto px-4 pt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div
                class="mb-4 rounded-md border px-4 py-3
                  {% if category == 'success' %}bg-green-100 text-green-800 border-green-200
                  {% elif category == 'info' %}bg-blue-100 text-blue-800 border-blue-200
                  {% elif category == 'warning' %}bg-yellow-100 text-yellow-800 border-yellow-200
                  {% else %}bg-red-100 text-red-800 border-red-200
                  {% endif %}"
                role="alert"
              >
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>
      {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto border-t border-gray-200 py-4 text-center">
      <a class="text-blue-600 hover:underline" href="https://ru.hexlet.io">Hexlet</a>
    </footer>
  </body>
</html>
