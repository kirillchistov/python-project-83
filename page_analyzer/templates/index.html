{% extends "layout.html" %}

{% block content %}
  <div class="container mx-auto flex flex-grow items-start justify-center px-4 py-16">
    <div class="w-full max-w-3xl rounded-lg border border-gray-200 bg-white p-10">
      <h1 class="text-4xl font-bold text-gray-900">Анализатор страниц</h1>
      <p class="mt-3 text-lg text-gray-500">
        Бесплатно проверяйте сайты на SEO-пригодность
      </p>
      <form action="/urls" method="post" class="mt-8 flex flex-col gap-3 sm:flex-row">
        <input
          class="w-full rounded-md border-gray-300"
          type="text"
          name="url"
          placeholder="https://www.example.com"
          value="{{ url | default('') }}"
        >
        <button
          class="rounded-md bg-blue-600 px-6 py-2 font-semibold uppercase text-white hover:bg-blue-700"
          type="submit"
        >
          Проверить
        </button>
      </form>
    </div>
  </div>
{% endblock %}
